name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      # ============================================
      # DEPLOYMENT STEP - Choose Your Platform
      # ============================================
      
      # Option 1: Vercel (Recommended)
      # Uncomment and add VERCEL_TOKEN to GitHub secrets
      # - name: Deploy to Vercel
      #   run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      
      # Option 2: Netlify
      # Uncomment and add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to GitHub secrets
      # - name: Deploy to Netlify
      #   run: npx netlify deploy --prod --dir=dist --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}
      
      # Option 3: Firebase Hosting
      # Uncomment and set up Firebase GitHub Action
      # - name: Deploy to Firebase
      #   uses: FirebaseExtended/action-hosting-deploy@v0
      #   with:
      #     repoToken: '${{ secrets.GITHUB_TOKEN }}'
      #     firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      #     channelId: live
      
      # Option 4: Cloudflare Pages
      # Uncomment and add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to secrets
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/pages-action@v1
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     projectName: your-project-name
      #     directory: dist
      
      - name: Deployment Complete
        run: echo "Choose a deployment platform above and uncomment the relevant section"
