<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CRM Dashboard</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Sales</a>
            <a href="#">Customers</a>
        </nav>
    </header>

    <main>
        <section id="sales-performance">
            <h2>Sales Performance</h2>
            <div class="chart-container">
                <!-- Sales Chart Placeholder -->
                <img src="https://via.placeholder.com/400x200.png?text=Sales+Chart" alt="Sales Chart">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Revenue</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Product A</td>
                            <td>$1000</td>
                        </tr>
                        <tr>
                            <td>Product B</td>
                            <td>$1500</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="customer-activity">
            <h2>Customer Activity</h2>
            <div class="chart-container">
                <!-- Customer Activity Chart Placeholder -->
                <img src="https://via.placeholder.com/400x200.png?text=Customer+Activity+Chart" alt="Customer Activity Chart">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Last Activity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Customer 1</td>
                            <td>2024-02-01</td>
                        </tr>
                        <tr>
                            <td>Customer 2</td>
                            <td>2024-02-02</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="key-metrics">
            <h2>Key Metrics</h2>
            <div class="metric-card">
                <h3>Total Revenue</h3>
                <p>$2500</p>
            </div>
            <div class="metric-card">
                <h3>Customer Acquisition Cost</h3>
                <p>$50</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CRM</p>
    </footer>
</body>
</html>
