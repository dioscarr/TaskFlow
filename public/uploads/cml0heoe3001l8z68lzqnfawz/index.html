<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Launch</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Hero Section */
        .hero {
            background-color: #f0f0f0;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2em;
            color: #555;
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: space-around;
            padding: 50px 20px;
            flex-wrap: wrap;
        }

        .feature {
            width: 300px;
            padding: 20px;
            margin: 20px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .feature h3 {
            margin-bottom: 10px;
        }

        .feature p {
            color: #555;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Introducing Our Awesome Product!</h1>
        <p>The future is here. Get ready to experience the innovation.</p>
    </section>

    <section class="features">
        <div class="feature">
            <h3>Feature 1</h3>
            <p>Description of feature 1. Key benefits and advantages.</p>
        </div>

        <div class="feature">
            <h3>Feature 2</h3>
            <p>Description of feature 2. Key benefits and advantages.</p>
        </div>

        <div class="feature">
            <h3>Feature 3</h3>
            <p>Description of feature 3. Key benefits and advantages.</p>
        </div>
    </section>

</body>
</html>
