<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-semibold mb-4">CRM Dashboard</h1>

        <!-- Sales Performance -->
        <div class="bg-white shadow-md rounded-md p-4 mb-4">
            <h2 class="text-xl font-semibold mb-2">Sales Performance</h2>
            <img src="https://via.placeholder.com/800x300" alt="Sales Chart" class="w-full">
        </div>

        <!-- Customer Activity -->
        <div class="bg-white shadow-md rounded-md p-4 mb-4">
            <h2 class="text-xl font-semibold mb-2">Customer Activity</h2>
            <table class="w-full">
                <thead>
                    <tr>
                        <th class="text-left">Name</th>
                        <th class="text-left">Email</th>
                        <th class="text-left">Activity</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>John Doe</td>
                        <td>john.doe@example.com</td>
                        <td>Last contacted: 2024-01-20</td>
                    </tr>
                    <tr>
                        <td>Jane Smith</td>
                        <td>jane.smith@example.com</td>
                        <td>Sent quote: 2024-01-22</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Key Metrics -->
        <div class="bg-white shadow-md rounded-md p-4">
            <h2 class="text-xl font-semibold mb-2">Key Metrics</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-gray-200 p-2 rounded-md">
                    <h3>Total Sales</h3>
                    <p>10,000</p>
                </div>
                <div class="bg-gray-200 p-2 rounded-md">
                    <h3>New Customers</h3>
                    <p>100</p>
                </div>
                <div class="bg-gray-200 p-2 rounded-md">
                    <h3>Customer Retention</h3>
                    <p>80%</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
