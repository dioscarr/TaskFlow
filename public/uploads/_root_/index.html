<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Launch Microsite</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        .hero {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://placehold.co/1200x400');
            background-size: cover;
            color: white;
            text-align: center;
            padding: 5em 0;
        }
        .features {
            padding: 2em;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .feature {
            width: 30%;
            margin-bottom: 1em;
            padding: 1em;
            background-color: white;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Product Launch</h1>
    </header>

    <div class="hero">
        <h2>Revolutionary Product</h2>
        <p>Launching soon!</p>
    </div>

    <div class="features">
        <div class="feature">
            <h3>Feature 1</h3>
            <p>Description of feature 1.</p>
        </div>
        <div class="feature">
            <h3>Feature 2</h3>
            <p>Description of feature 2.</p>
        </div>
        <div class="feature">
            <h3>Feature 3</h3>
            <p>Description of feature 3.</p>
        </div>
    </div>

    <footer>
        &copy; 2024
    </footer>
</body>
</html>
