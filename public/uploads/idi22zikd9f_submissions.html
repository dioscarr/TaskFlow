<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Lead Submissions Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a192f;
            color: #ccd6f6;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center content horizontally */
            min-height: 100vh; /* Ensure the body takes up at least the full viewport height */
        }

        .container {
            width: 90%; /* Make the container responsive */
            max-width: 1200px; /* Set a maximum width */
            margin: 20px auto; /* Add some margin and center horizontally */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            background: rgba(17, 34, 64, 0.6); /* Glassmorphism background */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(17, 34, 64, 0.3);
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #64ffda;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        #filters {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #filters label {
            color: #a8b2d1;
            margin-right: 10px;
        }

        #filters input, #filters select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #233554;
            background-color: #1e2d4a;
            color: #ccd6f6;
            margin-bottom: 10px;
        }

        #chartContainer {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            background: rgba(17, 34, 64, 0.6); /* Glassmorphism background */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(17, 34, 64, 0.3);
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        #chartContainer:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 35px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            background: rgba(17, 34, 64, 0.6); /* Glassmorphism background */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(17, 34, 64, 0.3);
            transition: all 0.3s ease;
        }

        table:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 35px rgba(0, 0, 0, 0.4);
        }


        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid #233554;
        }

        th {
            background-color: #1e3a8a;
            color: #fff;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background-color: #172a45;
            transition: background-color 0.3s ease;
        }

        tbody tr:nth-child(even) {
            background-color: #132540;
        }

        table, th, td {
            border: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            #filters {
                flex-direction: column;
                align-items: flex-start;
            }

            #filters label {
                margin-right: 0;
            }

            #filters input, #filters select {
                width: 100%;
                box-sizing: border-box;
            }

            th, td {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lead Submissions Dashboard</h1>

        <div id="filters">
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">

            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">

            <button onclick="applyFilters()">Apply Filters</button>
        </div>

        <div id="chartContainer">
            <canvas id="leadChart"></canvas>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="submissionsTable">
            </tbody>
        </table>
    </div>

    <script>
        const initialData = [
            { name: 'John Doe', email: 'john.doe@example.com', phone: '123-456-7890', date: '2024-01-01' },
            { name: 'Jane Smith', email: 'jane.smith@example.com', phone: '987-654-3210', date: '2024-01-02' },
            { name: 'Peter Jones', email: 'peter.jones@example.com', phone: '555-123-4567', date: '2024-01-03' },
            { name: 'Mary Brown', email: 'mary.brown@example.com', phone: '111-222-3333', date: '2024-01-04' },
            { name: 'David Lee', email: 'david.lee@example.com', phone: '444-555-6666', date: '2024-01-05' },
            { name: 'Sarah Wilson', email: 'sarah.wilson@example.com', phone: '777-888-9999', date: '2024-01-06' },
            { name: 'Michael Garcia', email: 'michael.garcia@example.com', phone: '333-444-5555', date: '2024-01-07' },
            { name: 'Linda Rodriguez', email: 'linda.rodriguez@example.com', phone: '666-777-8888', date: '2024-01-08' },
            { name: 'Christopher Williams', email: 'christopher.williams@example.com', phone: '222-333-4444', date: '2024-01-09' },
            { name: 'Angela Davis', email: 'angela.davis@example.com', phone: '888-999-0000', date: '2024-01-10' },
            { name: 'Robert Martinez', email: 'robert.martinez@example.com', phone: '999-000-1111', date: '2024-01-11' },
            { name: 'Amanda Anderson', email: 'amanda.anderson@example.com', phone: '000-111-2222', date: '2024-01-12' }
        ];


        function renderTable(data) {
            const tableBody = document.getElementById('submissionsTable');
            tableBody.innerHTML = ''; // Clear existing table data

            data.forEach(submission => {
                const row = tableBody.insertRow();
                const nameCell = row.insertCell();
                const emailCell = row.insertCell();
                const phoneCell = row.insertCell();
                const dateCell = row.insertCell();

                nameCell.textContent = submission.name;
                emailCell.textContent = submission.email;
                phoneCell.textContent = submission.phone;
                dateCell.textContent = submission.date;
            });
        }

        function prepareChartData(data) {
            const dailyCounts = {};

            data.forEach(submission => {
                const date = submission.date;
                dailyCounts[date] = (dailyCounts[date] || 0) + 1;
            });

            const labels = Object.keys(dailyCounts).sort();
            const counts = labels.map(date => dailyCounts[date]);

            return { labels: labels, counts: counts };
        }

        let leadChart; // Declare chart variable in a higher scope

        function renderChart(labels, counts) {
             const ctx = document.getElementById('leadChart').getContext('2d');

            if (leadChart) {
                leadChart.destroy(); // Destroy existing chart instance
            }


            leadChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Lead Submissions',
                        data: counts,
                        fill: false,
                        borderColor: '#64ffda',
                        tension: 0.4,
                        pointBackgroundColor: '#64ffda',
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    scales: {
                         x: {
                            type: 'time',
                            time: {
                                unit: 'day'
                            },
                            ticks: {
                                source: 'data'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Leads',
                                color: '#a8b2d1'
                            },
                            ticks: {
                                color: '#a8b2d1'
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: (context) => {
                                    return context[0].label;
                                },
                                label: (context) => {
                                    return `Leads: ${context.parsed.y}`;
                                }
                            },
                             backgroundColor: 'rgba(30, 58, 138, 0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: '#64ffda',
                            borderWidth: 1
                        },
                        legend: {
                            labels: {
                                color: '#a8b2d1'
                            }
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }


        function applyFilters() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;

            const startDate = startDateInput ? new Date(startDateInput) : null;
            const endDate = endDateInput ? new Date(endDateInput) : null;

            const filteredData = initialData.filter(submission => {
                const submissionDate = new Date(submission.date);

                if (startDate && submissionDate < startDate) {
                    return false;
                }

                if (endDate && submissionDate > endDate) {
                    return false;
                }

                return true;
            });

            renderTable(filteredData);
            const chartData = prepareChartData(filteredData);
            renderChart(chartData.labels, chartData.counts);
        }

        // Initial data load
        renderTable(initialData);
        const initialChartData = prepareChartData(initialData);
        renderChart(initialChartData.labels, initialChartData.counts);
    </script>
</body>
</html>
