<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-semibold mb-4">CRM Dashboard</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Sales Performance -->
            <div class="bg-white shadow-md rounded-md p-4">
                <h2 class="text-lg font-semibold mb-2">Sales Performance</h2>
                <img src="https://via.placeholder.com/300x200" alt="Sales Chart" class="w-full">
            </div>
            
            <!-- Customer Activity -->
            <div class="bg-white shadow-md rounded-md p-4">
                <h2 class="text-lg font-semibold mb-2">Customer Activity</h2>
                <img src="https://via.placeholder.com/300x200" alt="Activity Chart" class="w-full">
            </div>
            
            <!-- Key Metrics -->
            <div class="bg-white shadow-md rounded-md p-4">
                <h2 class="text-lg font-semibold mb-2">Key Metrics</h2>
                <table class="table-auto w-full">
                    <thead>
                        <tr>
                            <th class="text-left">Metric</th>
                            <th class="text-left">Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>New Customers</td>
                            <td>120</td>
                        </tr>
                        <tr>
                            <td>Total Revenue</td>
                            <td>$50,000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
